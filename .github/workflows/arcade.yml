name: Generate arcade animation

on:
  schedule: # dieksekusi setiap 12 jam otomatis
    - cron: "* */12 * * *"

  workflow_dispatch: # memungkinkan Anda menjalankan action secara manual

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          platform: 'scenario'
          scenario: 'full'
          # Trik CSS di bawah ini berfungsi untuk menghapus label bulan dan teks statistik bawaan
          custom_css: ".month { display: none !important; } .legend { display: none !important; }"

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
